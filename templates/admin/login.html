<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in &middot; {{ brand_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237C5CFF'/><text x='16' y='23' font-family='sans-serif' font-weight='700' font-size='18' fill='white' text-anchor='middle'>A</text></svg>">
</head>
<body>
<main class="auth">
  <div class="auth__box">
    <div class="auth__mark">{{ brand_name[:1] | upper }}</div>
    <h1>{{ brand_name }} desk</h1>
    <p class="auth__sub">Leads, quotes, money and support in one place.</p>

    <div class="pan">
      <div class="pan__b">
        {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="note {{ 'note--bad' if category == 'error' else 'note--good' }}" style="margin-bottom:14px">{{ message }}</div>
        {% endfor %}

        <form method="post" class="grid">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="next" value="{{ next_url }}">
          <div class="fi fi--12">
            <label for="email">Email</label>
            <input class="in" id="email" name="email" type="email" autocomplete="username"
                   value="{{ email or '' }}" required autofocus>
          </div>
          <div class="fi fi--12">
            <label for="password">Password</label>
            <input class="in" id="password" name="password" type="password"
                   autocomplete="current-password" required>
          </div>
          <div class="fi fi--12">
            <button class="b b--lg" type="submit">Sign in</button>
          </div>
        </form>
      </div>
    </div>

    <p class="hint" style="text-align:center">
      Client looking for your project? <a href="{{ url_for('portal.login') }}">Use the client portal</a>.
    </p>
  </div>
</main>
</body>
</html>
